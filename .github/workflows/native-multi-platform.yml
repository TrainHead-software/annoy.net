name: native-multi-platform

on:
  push:
    branches: [ main, master ]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native:
    name: Build ${{ matrix.platform.id }}
    runs-on: ${{ matrix.platform.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: windows-x64
            runs_on: windows-2022
            build_config: Release
            library_path: build/Release/annoy_c.dll
            release_asset_name: annoy_c-windows-x64.dll
          - id: linux-x64
            runs_on: ubuntu-24.04
            build_config: Release
            library_path: build/libannoy_c.so
            release_asset_name: libannoy_c-linux-x64.so
          - id: macos-x64
            runs_on: macos-13
            build_config: Release
            library_path: build/libannoy_c.dylib
            release_asset_name: libannoy_c-macos-x64.dylib

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout spotify/annoy into ./annoy
        uses: actions/checkout@v4
        with:
          repository: spotify/annoy
          path: annoy
          fetch-depth: 1

      - name: Validate Annoy source
        shell: pwsh
        run: |
          if (!(Test-Path "annoy/src/annoylib.h")) {
            throw "Missing annoy/src/annoylib.h"
          }
          if (!(Test-Path "annoy/src/kissrandom.h")) {
            throw "Missing annoy/src/kissrandom.h"
          }

      - name: Configure
        shell: pwsh
        run: |
          $args = @(
            "-S", "annoy_clang",
            "-B", "build",
            "-DCMAKE_BUILD_TYPE=${{ matrix.platform.build_config }}"
          )

          if ("${{ runner.os }}" -eq "Windows") {
            $args += @("-G", "Visual Studio 17 2022", "-A", "x64")
          }

          & cmake @args

      - name: Build
        shell: pwsh
        run: |
          $args = @("--build", "build", "--parallel")

          if ("${{ runner.os }}" -eq "Windows") {
            $args += @("--config", "${{ matrix.platform.build_config }}")
          }

          & cmake @args

      - name: Run native tests
        shell: pwsh
        run: |
          $args = @("--test-dir", "build", "--output-on-failure")

          if ("${{ runner.os }}" -eq "Windows") {
            $args += @("-C", "${{ matrix.platform.build_config }}")
          }

          & ctest @args

      - name: Stage release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          Copy-Item "${{ matrix.platform.library_path }}" "dist/${{ matrix.platform.release_asset_name }}"

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.id }}
          if-no-files-found: error
          path: dist/${{ matrix.platform.release_asset_name }}

  publish-release-assets:
    name: Publish release assets
    needs: build-native
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04

    steps:
      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.dll
            release-assets/**/*.so
            release-assets/**/*.dylib
